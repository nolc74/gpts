<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111326">
<title>영원의 구슬 — 캐릭터 생성</title>
<style>
:root{color-scheme:dark;--gold:#e8c98b;--muted:#aaa9c2;--panel:#17182d;--line:#6f6387;--violet:#a88bff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090d1b;color:#f6f0ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;display:grid;place-items:center;padding:18px;overflow-x:hidden}
.scene{width:min(100%,520px);min-height:min(900px,calc(100dvh - 36px));position:relative;overflow:hidden;border:2px solid #78658f;border-radius:12px;background:linear-gradient(#1c3150 0%,#536b86 40%,#28334a 65%,#111326 100%);box-shadow:0 20px 80px #000b}
.sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#fff5cf55,transparent 35%),linear-gradient(180deg,#8bb8d7 0%,#344c72 58%,#182036 100%)}
.moon{position:absolute;width:74px;height:74px;border-radius:50%;background:#fff1c9;top:12%;right:13%;box-shadow:0 0 40px #fff0bd88}
.mountain{position:absolute;bottom:34%;width:130%;height:36%;left:-15%;background:#303d5a;clip-path:polygon(0 100%,22% 22%,34% 65%,52% 0,73% 62%,86% 25%,100% 100%)}
.castle{position:absolute;bottom:39%;right:7%;width:100px;height:135px;background:#55516d;clip-path:polygon(0 100%,0 35%,15% 35%,15% 18%,26% 18%,26% 0,39% 0,39% 27%,55% 27%,55% 9%,68% 9%,68% 35%,100% 35%,100% 100%);filter:drop-shadow(4px 5px 0 #15182b)}
.castle:after{content:"";position:absolute;inset:45% 10% 0;background:repeating-linear-gradient(90deg,#e8c98b 0 5px,transparent 5px 19px)}
.ground{position:absolute;bottom:0;height:38%;width:130%;left:-15%;background:repeating-linear-gradient(0deg,#24253b 0 8px,#30334d 8px 16px);clip-path:polygon(0 100%,9% 45%,27% 24%,45% 37%,67% 13%,86% 30%,100% 100%)}
header{position:relative;text-align:center;padding:26px 18px 0;text-shadow:0 3px 0 #171326}
.orb{width:42px;height:42px;border:2px solid var(--gold);border-radius:50%;margin:0 auto 8px;background:radial-gradient(circle at 35% 30%,#fff,#c6a5ff 20%,#6d43c5 48%,#17102e 72%);box-shadow:0 0 22px #a88bff}
h1{margin:0;font-family:serif;font-size:clamp(28px,7vw,40px);letter-spacing:.12em;color:#fff1cf}
.subtitle{margin:7px 0 0;color:#e4dcf4;font-size:12px;letter-spacing:.2em}
.content{position:relative;padding:22px 18px 20px;display:flex;flex-direction:column;gap:14px}
.panel{background:linear-gradient(145deg,#17182deF,#101326ed);border:1px solid var(--line);border-radius:9px;padding:14px;box-shadow:0 8px 20px #07091488}
.section-title{font-size:12px;letter-spacing:.12em;color:var(--gold);margin:0 0 10px}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1px solid #5c5578;background:#24243c;border-radius:8px;color:#e9e1f5;padding:9px 8px;cursor:pointer;display:grid;justify-items:center;gap:4px;transition:.15s}
.choice[aria-pressed=true]{border:2px solid #b9a1ff;background:#30294c;box-shadow:0 0 16px #9d7aff55}
.choice span{font-size:13px}.choice small{color:var(--muted);font-size:10px}
.preview{height:154px;display:grid;place-items:center;position:relative;background:linear-gradient(180deg,#29334c99,#15182a99);border:1px solid #4d4b68;border-radius:8px;overflow:hidden}
.preview:before{content:"";position:absolute;bottom:16px;width:150px;height:18px;border-radius:50%;background:#080b17aa;filter:blur(5px)}
canvas{width:128px;height:144px;image-rendering:pixelated;position:relative;z-index:1}
input{width:100%;background:#0d1020;border:1px solid #6c6380;border-radius:7px;padding:13px;color:white;font-size:16px;outline:none}
input:focus{border-color:#c4a9ff;box-shadow:0 0 0 3px #a88bff25}
.hint{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
button.primary{width:100%;padding:14px;border:1px solid #f1d69b;border-radius:8px;background:linear-gradient(#64518d,#30264d);color:#fff2d4;font-size:16px;font-weight:700;letter-spacing:.08em;cursor:pointer;box-shadow:0 4px 0 #171226}
button.primary:disabled{opacity:.45;cursor:not-allowed}
.story{text-align:center;color:#d7cce8;font-family:serif;font-size:12px;line-height:1.8;margin:0}
.notice{font-size:11px;color:#c6bfd7;text-align:center;min-height:16px}
@media(min-height:850px){.content{gap:17px;padding-top:30px}.preview{height:180px}canvas{height:166px;width:148px}}
</style>
</head>
<body>
<main class="scene">
<div class="sky"></div><div class="moon"></div><div class="mountain"></div><div class="castle"></div><div class="ground"></div>
<header><div class="orb"></div><h1>영원의 구슬</h1><p class="subtitle">ETERNAL ORB · CHARACTER CREATION</p></header>
<section class="content">
<p class="story">이 세계에 다시 깨어난 당신.<br>모든 것은, 새로운 이야기의 시작—</p>
<div class="panel">
<p class="section-title">01 · 캐릭터 선택</p>
<div class="gender">
<button class="choice" id="male" aria-pressed="true" type="button"><canvas id="maleIcon" width="32" height="40"></canvas><span>남성형</span><small>모험가</small></button>
<button class="choice" id="female" aria-pressed="false" type="button"><canvas id="femaleIcon" width="32" height="40"></canvas><span>여성형</span><small>모험가</small></button>
</div>
<div class="preview" style="margin-top:12px"><canvas id="hero" width="64" height="72" aria-label="선택한 캐릭터 픽셀 미리보기"></canvas></div>
</div>
<div class="panel">
<label class="section-title" for="playerName">02 · 모험가의 이름</label>
<input id="playerName" type="text" maxlength="12" autocomplete="off" placeholder="이름을 입력해 줘" aria-describedby="nameHint">
<div class="hint"><span id="nameHint">원하는 이름을 직접 입력할 수 있어.</span><span id="count">0 / 12</span></div>
</div>
<button class="primary" id="confirm" type="button" disabled>이 이름과 모습으로 시작</button>
<p class="notice" id="notice" role="status">이름을 입력하면 모험을 시작할 수 있어.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let gender="male";
function pixel(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function draw(ctx,type,scale=1){ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.save();ctx.scale(scale,scale);
const female=type==="female";const cx=32;
const dark="#211b30",hair="#29233f",mid="#55436f",skin="#f0c4a1",coat="#282d49",trim="#c5a2ed",boot="#171827";
// shadow
pixel(ctx,17,65,30,3,"#111526");
// legs
pixel(ctx,21,48,8,14,coat);pixel(ctx,34,48,8,14,coat);pixel(ctx,20,60,10,5,boot);pixel(ctx,34,60,10,5,boot);
// body/cloak
pixel(ctx,16,31,32,23,coat);pixel(ctx,12,38,8,18,mid);pixel(ctx,44,38,8,18,mid);pixel(ctx,19,34,26,3,trim);pixel(ctx,29,34,6,18,"#3c345b");
// arms
pixel(ctx,12,35,7,17,skin);pixel(ctx,45,35,7,17,skin);pixel(ctx,12,47,7,6,coat);pixel(ctx,45,47,7,6,coat);
// neck and face
pixel(ctx,27,25,10,9,skin);pixel(ctx,19,11,26,20,skin);
if(female){pixel(ctx,16,9,32,25,hair);pixel(ctx,14,17,6,31,hair);pixel(ctx,44,17,6,31,hair);pixel(ctx,18,7,27,7,dark);pixel(ctx,20,23,5,3,"#33243c");}
else{pixel(ctx,17,9,29,13,hair);pixel(ctx,16,14,7,10,hair);pixel(ctx,42,13,6,10,hair);pixel(ctx,20,7,9,6,dark);pixel(ctx,34,6,8,7,dark);pixel(ctx,25,5,8,5,hair);}
pixel(ctx,23,20,4,3,"#382b3d");pixel(ctx,37,20,4,3,"#382b3d");pixel(ctx,24,21,2,2,"#a98cff");pixel(ctx,38,21,2,2,"#a98cff");pixel(ctx,29,27,6,1,"#a65e65");
// hood/cape edge and brooch
pixel(ctx,15,30,5,25,dark);pixel(ctx,44,30,5,25,dark);pixel(ctx,30,37,4,4,"#f0d18f");pixel(ctx,31,38,2,2,"#fff0bf");
ctx.restore()}
draw($("hero").getContext("2d"),"male",1);draw($("maleIcon").getContext("2d"),"male",.5);draw($("femaleIcon").getContext("2d"),"female",.5);
function select(g){gender=g;$("male").setAttribute("aria-pressed",String(g==="male"));$("female").setAttribute("aria-pressed",String(g==="female"));draw($("hero").getContext("2d"),g,1)}
$("male").addEventListener("click",()=>select("male"));$("female").addEventListener("click",()=>select("female"));
$("playerName").addEventListener("input",()=>{const n=$("playerName").value.trim();$("count").textContent=$("playerName").value.length+" / 12";$("confirm").disabled=!n;$("notice").textContent=n?"이름과 캐릭터를 확인하고 시작해 줘.":"이름을 입력하면 모험을 시작할 수 있어."});
$("confirm").addEventListener("click",()=>{const name=$("playerName").value.trim();if(!name)return;const data={name,gender,createdAt:new Date().toISOString()};try{sessionStorage.setItem("eternalOrbCharacter",JSON.stringify(data))}catch(e){}$("notice").textContent=name+" — 캐릭터가 준비됐어. 다음 장면은 프롤로그 던전이야.";});
</script>
</body>
</html>
